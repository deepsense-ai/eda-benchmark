# The model-benchmark.yaml set, run through a LiteLLM proxy (make ... LITELLM=1).
# Model names are the proxy ones (GET <proxy>/v1/models). claude-code takes them without
# the provider prefix: with a custom base URL Harbor passes the model name on as is.
# Not here: opencode with deepseek, which has no proxy route in this setup.
jobs_dir: results
n_attempts: 5
n_concurrent_trials: 10
agents:

  - model_name: claude-opus-5-5
    name: claude-code
    kwargs:
      reasoning_effort: xhigh

  - model_name: claude-sonnet-5-5
    name: claude-code
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-6.1-sol
    name: codex
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-5.6-sol
    name: codex
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-5.5
    name: codex
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-5.4
    name: codex
    kwargs:
      reasoning_effort: xhigh

  - model_name: google/gemini-3.8-flash
    name: antigravity-cli
    kwargs:
      reasoning_effort: high

  - model_name: google/gemini-3.1-pro-preview
    name: antigravity-cli
    kwargs:
      reasoning_effort: high

  - model_name: google/gemini-3.5-flash
    name: antigravity-cli
    kwargs:
      reasoning_effort: high
