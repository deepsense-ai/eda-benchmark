jobs_dir: results
n_attempts: 4
n_concurrent_trials: 10
environment:
  # Harness installation runs before agent.run(), under the environment baseline.
  # Keep these setup dependencies out of task definitions so tasks stay harness-agnostic.
  extra_allowed_hosts:
    - deb.debian.org
    - downloads.claude.ai
    - nodejs.org
    - raw.githubusercontent.com
    - registry.npmjs.org
agents:

  - model_name: anthropic/claude-fable-5
    name: claude-code
    extra_allowed_hosts:
      - api.anthropic.com
    kwargs:
      reasoning_effort: xhigh

  - model_name: anthropic/claude-sonnet-5
    name: claude-code
    extra_allowed_hosts:
      - api.anthropic.com
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-5.6-sol
    name: codex
    extra_allowed_hosts:
      - api.openai.com
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-5.5
    name: codex
    extra_allowed_hosts:
      - api.openai.com
    kwargs:
      reasoning_effort: xhigh

  - model_name: openai/gpt-5.4
    name: codex
    extra_allowed_hosts:
      - api.openai.com
    kwargs:
      reasoning_effort: xhigh

  - model_name: google/gemini-3.1-pro-preview
    name: gemini-cli
    extra_allowed_hosts:
      - generativelanguage.googleapis.com
    kwargs:
      reasoning_effort: high

  - model_name: google/gemini-3.5-flash
    name: gemini-cli
    extra_allowed_hosts:
      - generativelanguage.googleapis.com
    kwargs:
      reasoning_effort: high

  - model_name: deepseek/deepseek-reasoner
    name: opencode
    extra_allowed_hosts:
      - api.deepseek.com
    kwargs:
      reasoning_effort: high
